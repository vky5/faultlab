name: H6_scalability_convergence
hypothesis: "Gossip convergence time scales logarithmically with cluster size - doubling nodes increases convergence time by a constant factor, not linearly."

description: |
  This hypothesis tests the scalability of the gossip protocol.
  In epidemic-style gossip, information spreads exponentially:
  - Round 1: 1 node knows -> tells 1 peer = 2 nodes
  - Round 2: 2 nodes -> tell 2 peers = 4 nodes
  - Round 3: 4 nodes -> tell 4 peers = 8 nodes

  We test with varying cluster sizes:
  - 3 nodes (small)
  - 5 nodes (medium)
  - 10 nodes (large)

  For each size, we measure time for a single write to propagate to all nodes.

variables:
  cluster_sizes: [3, 5, 10]
  gossip_interval: 3  # ticks
  writes_per_test: 5
  convergence_threshold: 100%  # all nodes must have value

cluster:
  id: h6_cluster_large
  members:
    - id: node1
      port: 7601
    - id: node2
      port: 7602
    - id: node3
      port: 7603
    - id: node4
      port: 7604
    - id: node5
      port: 7605
    - id: node6
      port: 7606
    - id: node7
      port: 7607
    - id: node8
      port: 7608
    - id: node9
      port: 7609
    - id: node10
      port: 7610

timeline:
  - at: 0s
    action: start_cluster

  # Inject a network partition splitting the 10 nodes into two groups of 5
  - at: 4s
    action: partition
    groups:
      - [node1, node2, node3, node4, node5]
      - [node6, node7, node8, node9, node10]

  # Write on the left side
  - at: 8s
    action: write
    key: scale_test
    value: left_side_write
    target: group1
    groups:
      - [node1, node2, node3, node4, node5]
      - [node6, node7, node8, node9, node10]

  # Write on the right side
  - at: 8s
    action: write
    key: scale_test
    value: right_side_write
    target: group2
    groups:
      - [node1, node2, node3, node4, node5]
      - [node6, node7, node8, node9, node10]

  # Heal the massive partition
  - at: 15s
    action: heal_partition
    groups:
      - [node1, node2, node3, node4, node5]
      - [node6, node7, node8, node9, node10]

expected_outcome: |
  For 10-node cluster:
  - After healing, the massive split brain should converge logarithmically.
  - Expected time: 3-4 rounds for full convergence across 10 nodes.

validation:
  check_convergence: true
  check_keys:
    - scale_test
